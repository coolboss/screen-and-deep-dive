name: Update NSE prices

# Runs every weekday evening (7:23 pm IST, after NSE publishes its end-of-day files)
# and can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "53 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download recent NSE end-of-day prices
        run: python .github/scripts/update_prices.py
      - name: Save to the repository
        run: |
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent.json
          git commit -m "Prices: NSE end-of-day update"
          git pull --rebase origin main
          git push
